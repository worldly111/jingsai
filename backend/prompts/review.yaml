agent: review
name: 项目指导辅助
description: 对申报书、作品说明等材料做结构完整性、要素覆盖与规范性初检，生成修改建议与预答辩问题。
answer_rules:
  - 检查结论必须可复核：指出具体缺失章节、篇幅不足与不规范之处。
  - 评分与结论来自量表（data/rules/review_rubrics.yaml），不得凭主观印象给分。
  - 修改建议要具体到"补什么内容、补在哪一节"，不说空话。
  - 预答辩问题要针对材料中的薄弱环节，而不是通用套话。

nodes:
  - id: prepare_text
    title: 材料解析与类型识别
    desc: 支持直接粘贴文本或上传文件（PDF/Word/文本），自动识别材料类型。

  - id: rule_check
    title: 量表规则检查
    desc: 按检查量表逐项核对必需章节、篇幅、要素关键词、占位符与匿名要求，输出可复核的问题清单。

  - id: llm_suggest
    title: 生成修改建议与追问
    desc: 配置大模型时由其结合问题清单给出具体改写建议与更深入的答辩问题；未配置时使用量表内置建议。
    system: |
      你是竞赛作品材料的评审辅导老师。你只依据给出的量表检查结论和材料节选提建议，
      不要引入未在材料中出现的假设。
    user: |
      【材料类型】{material_label}

      【量表检查结论】
      {checks}

      【材料节选】
      {excerpt}

      【已发现的亮点】
      {suggestions}

      请完成：
      1. 针对缺失或薄弱的章节，给出 3-6 条具体、可执行的修改建议（要指出补什么内容、补在哪一节）。
      2. 针对缺失要素，给出 2-4 条可直接套用的改写示例句。
      3. 结合材料薄弱环节，提出 5-8 个预答辩问题（按被问到的可能性排序）。

      以 JSON 输出：{{"suggestions": [], "rewrites": [{{"section": "", "example": ""}}], "questions": []}}

  - id: compose
    title: 输出检查报告
    desc: 汇总评分、问题清单、亮点、修改建议与预答辩问题，可导出为 Word 检查报告。
    system: |
      你是竞赛作品材料的评审辅导老师，帮助学生发现材料问题并给出可操作的修改意见。
      规则：
      {answer_rules}
    user: |
      【参赛语境】
      {question}

      【材料类型】
      {material_label}

      【量表检查结果（结构化，可作为事实依据）】
      {structured}

      【规程要求片段】
      {evidence}

      【输出要求】
      1. 先给整体评价与初步评分（0-100）及评分依据。
      2. 按"必须修改 / 建议修改 / 可选优化"三档列出问题，每条写明位置与改法。
      3. 针对缺失要素，给出可直接套用的改写示例句。
      4. 输出 5-8 个预答辩问题，按被问到的可能性排序，并给出回答要点提示。
      5. 提示该赛事对材料的特殊要求（如匿名、页数、格式），注明出处。

edges:
  - {from: START, to: prepare_text}
  - {from: prepare_text, to: rule_check}
  - {from: rule_check, to: llm_suggest}
  - {from: llm_suggest, to: compose}