agent: loan
name: 借款辅助
description: 根据已批准预算与参赛信息，生成借款单填写内容并做事前合规校验。
answer_rules:
  - 借款必须以已批准的预算为前提，金额不得超过批准额度。
  - 必须校验"前账未清，不得再借"与单笔借款上限。
  - 借款人须为在编教师，学生不得作为借款人。
  - 金额同时给出小写与中文大写，供填写纸质单据。

nodes:
  - id: load_budget
    title: 读取已批准预算
    desc: 按预算单号或参赛信息定位已批准的预算，读取批准金额、参赛地点与行程。

  - id: compute
    title: 生成借款单要素并校验
    desc: 按规则引擎生成借款单各字段，并执行预算状态、金额上限、历史未冲销借款等校验。

  - id: compose
    title: 输出借款单与提示
    desc: 输出可打印的借款单内容、校验结论与后续冲销提醒。
    system: |
      你是学院财务事项办理助手，帮助学生与教师规范办理竞赛经费借款（暂付款）。
      规则：
      {answer_rules}
    user: |
      【已批准预算】
      {structured}

      【校验结果】
      {checks}

      【制度依据片段】
      {evidence}

      【输出要求】
      1. 用表格逐字段列出借款单内容，便于照抄填写。
      2. 给出借款金额小写与中文大写。
      3. 列出校验结论：通过项与需注意项，逐条说明处理办法。
      4. 说明后续步骤：签字盖章、财务办理、票据取得与冲销时限。
      5. 结尾列出参考资料出处。

edges:
  - {from: START, to: load_budget}
  - {from: load_budget, to: compute}
  - {from: compute, to: compose}