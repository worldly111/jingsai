# ============================================================
#  竞赛认定目录（赛事级别 / 类别）
#  ------------------------------------------------------------
#  用于新增赛事时快速认定级别与类别，并作为台账维护的参考目录。
#  学校竞赛认定目录每年可能调整，本表仅为参考口径，最终以学校当年
#  发布的《学科竞赛认定目录》为准。
#  competition_name_pattern 支持模糊匹配（新增赛事时按名称套用）。
# ============================================================

rules:
  # ---------- 综合创新类 ----------
  - competition_name_pattern: 中国国际大学生创新大赛
    level: 国家级
    category: 综合创新类
    score: 100
    note: 原“互联网+”大学生创新创业大赛，学校认定最高级别赛事
    source: 学校学科竞赛认定目录（参考）
  - competition_name_pattern: 互联网+
    level: 国家级
    category: 综合创新类
    score: 100
    note: 中国国际大学生创新大赛的旧称
    source: 学校学科竞赛认定目录（参考）
  - competition_name_pattern: 挑战杯
    level: 国家级
    category: 综合创新类
    score: 100
    note: 全国大学生课外学术科技作品竞赛 / 创业计划竞赛
    source: 学校学科竞赛认定目录（参考）
  - competition_name_pattern: 大学生创新创业训练计划
    level: 国家级
    category: 综合创新类
    score: 80
    note: 大创项目，按项目立项与结题认定
    source: 学校学科竞赛认定目录（参考）

