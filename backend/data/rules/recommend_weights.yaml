# ============================================================
#  竞赛推荐打分权重
#  ------------------------------------------------------------
#  竞赛推荐 = 专业适配度 × 方向匹配 × 年级适配 × 项目情况 × 级别偏好
#  权重可在本文件调整；每个赛事的适配数据存放在数据库 major_competition_fit 表中，
#  新增赛事时只需补一行适配数据，无需改代码。
# ============================================================

weights:
  major_fit: 0.34        # 专业与赛事的适配度（major_competition_fit）
  tech_tag_fit: 0.26     # 技术方向标签匹配
  grade_fit: 0.14        # 年级适配
  project_status: 0.14   # 已有项目/作品的利用程度
  level_bonus: 0.06      # 赛事级别加成
  fresh_bonus: 0.06      # 近期开放报名/时间节点临近的优先

grade_map:
  # 年级 → 适配的赛事难度档位（difficulty）
  "大一": ["入门", "中"]
  "大二": ["入门", "中", "高"]
  "大三": ["中", "高"]
  "大四": ["中", "高"]
  "研一": ["中", "高"]
  "研二": ["高", "中"]
  "研三": ["高"]

level_bonus_map:
  国家级: 1.0
  省级: 0.7
  校级: 0.5

# 推荐理由模板
reasons:
  major: "与你的专业方向高度相关，评委看重专业基础"
  tech_tag: "与你关注的技术方向（{tag}）直接对应"
  project: "你已有项目/作品基础，可直接改编为参赛作品"
  grade: "适合{grade}学生的难度档位（{difficulty}）"
  no_project: "无项目基础也可以参加，适合作为入门赛事积累经验"
  deadline: "报名截止 {date}，还有 {days} 天，建议优先安排"

# 备赛计划阶段模板：{T} 为距比赛日或提交截止日的天数
prep_stages:
  - name: 信息确认与报名
    offset_ratio: 1.0
    tasks:
      - 阅读竞赛通知与规程，确认赛道、组队规则与材料清单
      - 完成校赛/省赛系统报名，核对成员与指导教师信息
      - 建立队伍沟通群与共享文档，明确分工
  - name: 选题与方案设计
    offset_ratio: 0.8
    tasks:
      - 确定选题方向，完成 2～3 个候选方案比选
      - 撰写技术路线与初步进度表，请指导教师评审
      - 完成所需数据、软硬件环境的准备
  - name: 开发与阶段性验证
    offset_ratio: 0.55
    tasks:
      - 按模块推进开发/实验，每周同步进展
      - 完成核心功能的阶段性验证，记录实验数据
      - 中期检查：对照评审要点补强薄弱环节
  - name: 材料撰写与打磨
    offset_ratio: 0.28
    tasks:
      - 撰写申报书/作品说明，使用材料检查助手自查
      - 完善图表、截图、演示视频等佐证材料
      - 按匿名要求检查材料中的校名与教师姓名
  - name: 提交与答辩准备
    offset_ratio: 0.08
    tasks:
      - 按期提交材料，保留提交回执与系统截图
      - 准备答辩 PPT 与演示环境，进行 2 轮模拟答辩
      - 核对经费预算与报销材料要求