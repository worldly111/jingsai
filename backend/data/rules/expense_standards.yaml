  # ---------- 市内交通 ----------
  - code: ES-SN-GJ
    name: 国家级竞赛市内交通费标准
    category: 市内交通
    competition_level: 国家级
    region: 不限
    value_type: fixed
    value: 80
    unit: 元/人·天
    condition: { mode: 包干 }
    description: 驻地与赛场之间的公共交通费用，包干使用；使用学校公务用车的不再补贴。

  - code: ES-SN-SJ
    name: 省级竞赛市内交通费标准
