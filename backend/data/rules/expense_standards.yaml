  # ---------- 其他直接费用 ----------
  - code: ES-HC-01
    name: 竞赛作品耗材费
    category: 耗材费
    competition_level: 不限
    region: 不限
    value_type: cap
    value: 2000
    unit: 元/队
    condition: { require: 采购清单与发票 }
    description: 元器件、打印、刻录等作品制作耗材，按队设上限，据实报销。

  - code: ES-CS-01
    name: 作品测试与检测费
    category: 测试费
    competition_level: 不限
    region: 不限
    value_type: cap
    value: 3000
    unit: 元/队
    condition: { require: 检测机构发票与报告 }
