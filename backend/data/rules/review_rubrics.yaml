# ============================================================
#  项目材料检查量表
#  ------------------------------------------------------------
#  智能体对申报书、作品说明等材料做初步检查时使用的评分与校验规则。
#  新增材料类型或调整检查口径，只需在本文件增加/修改条目，代码无需改动。
#
#  字段说明：
#    sections      结构校验：必需章节、建议章节、篇幅区间
#    keyword_groups 要素覆盖：应当出现的要点关键词，缺失时给出修改建议
#    compliance    规范性检查：占位符、匿名要求、常见表述问题
#    questions     答辩问题模板：按缺失要素生成针对性的预答辩问题
# ============================================================

materials:
  application_form:
    name: 项目申报书检查量表
    label: 项目申报书 / 参赛报名表
    sections:
      - key: background
        name: 项目背景与意义
        required: true
        headings: ["背景", "意义", "研究现状", "需求分析", "国内外现状"]
        min_length: 200
        advice: 补充行业/学科背景、现有方案的不足与你所解决的问题，避免只写宏观口号
      - key: objective
        name: 目标与内容
        required: true
        headings: ["目标", "研究内容", "主要内容", "拟解决的问题", "建设目标"]
        min_length: 200
        advice: 目标应可度量，建议分"总体目标 + 3～5 项具体内容"来写
      - key: scheme
        name: 技术方案与路线
        required: true
        headings: ["方案", "技术路线", "技术方案", "实现方案", "系统设计", "架构"]
        min_length: 300
        advice: 说明总体架构、关键技术与实现步骤；建议附系统架构图与数据流说明
      - key: innovation
        name: 创新点与特色
        required: true
        headings: ["创新", "特色", "优势", "亮点"]
        min_length: 150
        advice: 创新点要与现有方案对比着写，明确"新在哪里、为什么更好"
      - key: plan
        name: 实施计划与进度安排
        required: true
        headings: ["进度", "计划", "安排", "时间节点", "实施计划"]
        min_length: 120
        advice: 建议用阶段表格呈现，标注里程碑与交付物，与赛事时间节点对齐
      - key: outcome
        name: 预期成果
        required: true
        headings: ["预期成果", "成果形式", "考核指标", "预期效果"]
        min_length: 120
        advice: 成果要可交付、可验收（软件、论文、专利、测试报告、用户数等）
      - key: team
        name: 团队分工
        required: false
        headings: ["团队", "成员", "分工", "组织结构"]
        min_length: 80
        advice: 说明成员分工与能力匹配，避免笼统写"共同完成"
      - key: budget
        name: 经费预算
        required: false
        headings: ["预算", "经费", "费用"]
        min_length: 60
        advice: 预算需列出明细与计算依据，并与竞赛经费开支范围一致
    keyword_groups:
      - group: 创新性表述
        words: ["创新", "首创", "改进", "优化", "突破", "新方法", "新模型"]
        advice: 建议明确写出 2～3 条可验证的创新点，避免"填补空白"等无法佐证的表述
      - group: 可行性论证
        words: ["可行", "验证", "测试", "实验", "样机", "原型", "试点"]
        advice: 补充可行性论证：已有基础、前期验证结果、可获得的数据与实验条件
      - group: 量化指标
        words: ["%", "提升", "降低", "准确率", "效率", "响应时间", "并发"]
        advice: 增加量化指标，把"提升明显"改为可测量的目标值
      - group: 推广价值
        words: ["推广", "应用场景", "社会效益", "经济效益", "落地"]
        advice: 补充应用场景与推广路径，说明成果的受益对象
    compliance:
      placeholder_words: ["待补充", "TODO", "待定", "XXX", "xxx", "（略）", "此处填写"]
      anonymize_required: true
      anonymize_patterns: ["学院", "指导老师", "指导教师", "学校", "大学"]
      max_school_mentions: 1
    questions:
      innovation_missing: "你的方案与已有的解决方案相比，核心差异是什么？如果评委认为现有方案已经够用，你如何回应？"
      feasible_missing: "项目目前处于什么阶段？有哪些已完成的验证或数据可以证明它是可行的？"
      metric_missing: "你如何衡量这个项目是否成功？请给出 2～3 个可测量的指标。"
      outcome_missing: "赛项结束后，你的成果会以什么形式交付？谁可以直接使用它？"
      team_missing: "团队成员之间的分工是怎样的？如果某位核心成员退出，项目如何继续？"
      budget_missing: "预算中占比最大的一项是什么？为什么需要这笔支出？"

  technical_doc:
    name: 作品说明 / 技术文档检查量表
    label: 作品说明书 / 设计文档 / 论文
    sections:
      - key: overview
        name: 作品概述
        required: true
        headings: ["概述", "简介", "作品介绍", "摘要"]
        min_length: 150
        advice: 用 300 字以内讲清楚"这是什么、解决什么问题、核心技术是什么"
      - key: design
        name: 系统设计
        required: true
        headings: ["设计", "架构", "模块", "流程", "结构"]
        min_length: 300
        advice: 建议包含架构图、模块划分与接口说明；关键算法给出公式或伪代码
      - key: implement
        name: 实现与关键技术
        required: true
        headings: ["实现", "关键技术", "算法", "开发", "部署"]
        min_length: 250
        advice: 说明开发环境、技术选型理由、关键难点与解决过程
      - key: test
        name: 测试与验证
        required: true
        headings: ["测试", "实验", "验证", "性能", "结果分析"]
        min_length: 200
        advice: 补充测试环境、数据集、对比实验与结果表格，说明指标含义
      - key: usage
        name: 使用说明
        required: false
        headings: ["使用说明", "操作说明", "运行", "部署说明"]
        min_length: 100
        advice: 给出可复现的部署与操作步骤，便于评委复现
      - key: reference
        name: 参考文献
        required: false
        headings: ["参考文献", "引用", "参考"]
        min_length: 30
        advice: 标注引用来源，注意格式统一
    keyword_groups:
      - group: 技术细节
        words: ["模型", "算法", "框架", "接口", "数据库", "协议", "架构"]
        advice: 补充技术细节，避免只有功能描述而缺少实现层面的说明
      - group: 数据与实验
        words: ["数据集", "样本", "对比", "基线", "消融", "准确率", "召回率"]
        advice: 建议增加对比实验（与基线方法比较）与结果分析
      - group: 工程规范
        words: ["版本", "依赖", "配置", "日志", "异常", "安全", "部署"]
        advice: 补充工程化说明：版本管理、依赖环境、异常处理与安全考虑
    compliance:
      placeholder_words: ["待补充", "TODO", "待定", "XXX", "xxxx", "（略）"]
      anonymize_required: true
      anonymize_patterns: ["学院", "指导老师", "指导教师", "学校", "大学"]
      max_school_mentions: 1
    questions:
      innovation_missing: "你的技术方案与同类作品的差异体现在哪里？请用一个具体场景说明优势。"
      metric_missing: "请说明测试方法与评价指标，为什么选这些指标而不是别的？"
      feasible_missing: "如果数据集规模扩大十倍，现有方案还能保持性能吗？瓶颈在哪里？"
      outcome_missing: "作品目前完成到什么程度？有哪些功能还没实现？"
      team_missing: "你在项目中负责哪一部分？请具体说明你的技术贡献。"
      budget_missing: "实现这个作品需要哪些资源？其中哪一项是最关键的？"

  defense_ppt:
    name: 答辩PPT检查量表
    label: 答辩演示文稿
    sections:
      - key: structure
        name: 与申报书结构一致
        required: true
        headings: ["背景", "方案", "创新", "成果", "计划"]
        min_length: 0
        advice: 答辩 PPT 建议覆盖背景问题、方案与创新、验证结果、团队与计划四段式
    keyword_groups:
      - group: 结果呈现
        words: ["结果", "数据", "指标", "对比", "演示"]
        advice: 用图表呈现结果，避免大段文字
    compliance:
      placeholder_words: ["待补充", "TODO", "XXX"]
      anonymize_required: true
      anonymize_patterns: ["学院", "指导老师", "指导教师", "学校", "大学"]
      max_school_mentions: 1
    questions:
      metric_missing: "你的核心指标是多少？与已有方案相比提升了多少？"
      innovation_missing: "用一句话说明你的创新点，并给出支撑它的一项证据。"
      feasible_missing: "项目目前的可运行程度如何？现场能否演示？"
      outcome_missing: "最终交付物有哪些？评审如何验证这些成果？"
      team_missing: "请说明团队分工与你的个人贡献。"
      budget_missing: "资源投入与产出是否匹配？如何证明这笔投入是必要的？"

# 答辩问题通用库：当材料中缺少对应要素时补充问询
general_questions:
  - "这个项目最核心的技术难点是什么？你们是如何解决的？"
  - "如果给你们追加一半的时间，你会优先完善哪一部分？"
  - "项目中的数据来源是什么？是否涉及隐私与合规问题？"
  - "成果如何持续维护？离开团队成员后还能继续运行吗？"
  - "你们如何确定所解决的问题是真实存在的？有没有做过用户调研？"
  - "与往届获奖作品相比，你们的改进点在哪里？"